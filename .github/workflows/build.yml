name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: swift build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain version
        run: swift --version

      - name: Build
        run: swift build -c release

      # Shell scripts are the install path, so a typo in them breaks users even
      # when the Swift compiles. -n parses without executing.
      - name: Check shell scripts
        run: bash -n build.sh install.sh uninstall.sh Tools/make-signing-cert.sh

      # Note: ./build.sh is deliberately not run here. It renders the app icon via
      # AppKit's lockFocus, which needs a window server that CI runners don't
      # reliably provide.
